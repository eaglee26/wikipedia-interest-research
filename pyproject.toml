[project]
name = "wikipedia-interest-research"
version = "0.1.0"
description = "Agent Skill: research topic interest across Wikipedia language editions (Wikimedia pageviews)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "certifi>=2024.2.2",
]

[dependency-groups]
dev = ["scipy>=1.11", "pypdf>=4", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["scripts", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E741", "B905"]  # E741: `l` is used for language codes
